services:
  gupax:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/libre-7/gupax-docker:latest
    container_name: gupax
    restart: unless-stopped
    stop_grace_period: 30s
    # Reap orphaned grandchildren. Gupax restarts monerod/P2Pool/XMRig, and
    # bash as PID 1 only reaps jobs it knows about (#GUP-07).
    init: true
    # Every user-facing variable is interpolated from .env. Compose does not
    # inject .env into the container by itself, so hard-coded literals here
    # made `cp .env.example .env` silently inert — including VNC_AUTH_TOKEN
    # (#GUP-02). `docker compose config` assertions in CI cover this.
    environment:
      TOR_ENABLED: "${TOR_ENABLED:-false}"
      TOR_EXPOSE_RPC: "${TOR_EXPOSE_RPC:-false}"
      # PUID/PGID default to 999 (the image's non-root 'miner' user). Override
      # them to match the host user if you mount a host path that must stay
      # owned by that user — e.g. an existing Monero blockchain.
      PUID: "${PUID:-999}"
      PGID: "${PGID:-999}"
      VNC_AUTH_TOKEN: "${VNC_AUTH_TOKEN:-}"
      MONERO_RPC_RESTRICTED: "${MONERO_RPC_RESTRICTED:-true}"
      SCREEN_RESOLUTION: "${SCREEN_RESOLUTION:-1920x1080x24}"
    volumes:
      - gupax-data:/home/miner/.local/share/gupax       # Gupax config + state + runtime binaries
      - ${MONERO_DATA_PATH:-gupax-monero}:/home/miner/.bitmonero  # Blockchain
      - gupax-tor:/home/miner/.tor                       # Persistent .onion address
    ports:
      - "6080:6080"   # noVNC web interface
      # VNC server — only uncomment if you've set VNC_AUTH_TOKEN above.
      # Exposing raw VNC without a password gives anyone on your network
      # full GUI control (change wallets, start/stop mining, etc.).
      # - "5900:5900"
      - "3333:3333"   # P2Pool stratum server
      - "37889:37889" # P2Pool P2P (p2pool peer connections)
      - "18080:18080" # Monero P2P
      - "18081:18081" # Monero RPC
      # monerod ZMQ pub (block notifications for P2Pool) —
      # bound internally via --zmq-pub tcp://127.0.0.1:18083
      # No host port needed unless you want external ZMQ access.
    # Anonymous inbound hidden service: Tor virtual 18084 → 127.0.0.1:18086
    # These are internal-only — not exposed to the host (doing so would
    # bypass Tor and defeat the purpose of anonymous-inbound).
    # - "18084:18084"  # Tor hidden service virtual port (do NOT expose)
    # - "18086:18086"  # monerod anonymous-inbound internal bind (do NOT expose)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
    # Drop all Linux capabilities, then add back only the minimum needed:
    # - SETUID/SETGID: gosu drops privileges from root to the mining user
    # - DAC_OVERRIDE: root must create/write files in /home/miner volume
    # - FOWNER: required for file operations when ownership changes at runtime
    # - CHOWN: start.sh fixes volume ownership at container startup
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - CHOWN

volumes:
  gupax-data:
  gupax-monero:
  gupax-tor:

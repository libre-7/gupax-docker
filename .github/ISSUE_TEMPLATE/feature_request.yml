---
name: Feature request
description: Suggest new capability or a change to existing behaviour
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, check the roadmap in `TODO.md` — several of these
        items are already tracked there.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation, not the solution. "When I run on
        Raspberry Pi there is no image" is more useful than "add arm64".
      placeholder: |
        I run this on a Raspberry Pi 5. Gupax publishes no arm64 Linux
        binary, so the container cannot run there at all.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area?
      options:
        - Tor / privacy
        - Unraid or NAS support
        - GPU / mining performance
        - noVNC / GUI or display
        - CI / releases / packaging
        - documentation
        - other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and the TODO roadmap for this already
          required: true
        - label: This is not upstream Gupax behaviour (I checked the Gupax project)
          required: false

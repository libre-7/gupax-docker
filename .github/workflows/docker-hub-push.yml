name: Push to Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: libre7/gupax-docker

jobs:
  push-to-dockerhub:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write  # failure alert comments on the CI watch issue (#76)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build date
        id: date
        run: |
          BUILD_DATE=$(date +%Y%m%d)
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          echo "Build date: $BUILD_DATE"

      - name: Detect Gupax version from upstream
        id: version
        env:
          # detect-gupax-version.sh uses GITHUB_TOKEN for Bearer auth to avoid
          # unauthenticated rate limits on GitHub's shared runner IP pool.
          # Without this the script's token branch never executes and a rate
          # limit becomes a red build. See #73 (M4).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/detect-gupax-version.sh
          # detect-gupax-version.sh writes release.env (VERSION + GUPAX_ASSET)
          # shellcheck disable=SC1091
          . ./release.env
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "GUPAX_ASSET=$GUPAX_ASSET" >> $GITHUB_ENV
          rm -f release.env

          VERSION_STRIPPED="${VERSION#v}"
          echo "Latest Gupax version: $VERSION (tag: $VERSION_STRIPPED)"
          # Branch-aware tagging. Slashes -> hyphens (invalid in Docker tags).
          SAFE_REF=$(echo "${{ github.ref_name }}" | tr '/' '-')
          # Tag strategy:
          #   :latest / :2.0.1 / :v2.0.1  — moving, always latest build
          #   :v2.0.1-YYYYMMDD             — date-stamped, immutable
          #   :<sha>                       — commit-pinned, immutable
          if [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="${{ env.IMAGE_NAME }}:latest"$'\n'"${{ env.IMAGE_NAME }}:$VERSION_STRIPPED"$'\n'"${{ env.IMAGE_NAME }}:$VERSION"$'\n'"${{ env.IMAGE_NAME }}:${VERSION}-$BUILD_DATE"$'\n'"${{ env.IMAGE_NAME }}:${{ github.sha }}"
          else
            TAGS="${{ env.IMAGE_NAME }}:${SAFE_REF}"$'\n'"${{ env.IMAGE_NAME }}:${SAFE_REF}-${{ github.sha }}"
          fi
          echo "Tags: $TAGS"
          echo "TAGS<<EOF"$'\n'"$TAGS"$'\n'"EOF" >> $GITHUB_ENV

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          GUPAX_VERSION: ${{ env.VERSION }}
          GUPAX_ASSET: ${{ env.GUPAX_ASSET }}
          BUILD_DATE: ${{ env.BUILD_DATE }}
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.TAGS }}
          build-args: |
            GUPAX_VERSION
            GUPAX_ASSET
            BUILD_DATE
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 76,  # CI watch — keep open, see its body
              body: `:rotating_light: **Docker Hub build failed** — registries are not being updated.\n\nWorkflow run: ${runUrl}\nBranch/commit: \`${context.ref}\` @ \`${context.sha}\`\n\`:latest\` on Docker Hub remains stale until this is fixed.\n\n_This is an automated alert. Issue #76 is the permanent CI watch target — do not close it, or these alerts stop working._`
            });

name: Mirror GHCR to Docker Hub (manual repair)

# Main-branch releases are built ONCE in docker-publish.yml and pushed to both
# registries, so the two names always resolve to the same digest. This workflow
# is the repair path: it copies an existing GHCR manifest to Docker Hub without
# rebuilding, which is what keeps a re-mirror byte-identical (#GUP-10).
#
# It deliberately has NO `push` trigger. A second build on merge is exactly the
# digest-divergence bug this project fixed.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to mirror from GHCR to Docker Hub (e.g. latest, v2.0.1-20261018-abc1234)"
        required: true
        default: "latest"

env:
  GHCR_IMAGE: ghcr.io/libre-7/gupax-docker
  DOCKERHUB_IMAGE: libre7/gupax-docker

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      issues: write  # failure alert comments on the CI watch issue (#76)

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy manifest (no rebuild)
        run: |
          SRC="${GHCR_IMAGE}:${{ inputs.tag }}"
          DST="${DOCKERHUB_IMAGE}:${{ inputs.tag }}"
          echo "Mirroring $SRC -> $DST"
          docker buildx imagetools create -t "$DST" "$SRC"

      - name: Verify mirrored digest
        run: |
          SRC_DIGEST=$(docker buildx imagetools inspect \
            "${GHCR_IMAGE}:${{ inputs.tag }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          DST_DIGEST=$(docker buildx imagetools inspect \
            "${DOCKERHUB_IMAGE}:${{ inputs.tag }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "GHCR:       $SRC_DIGEST"
          echo "Docker Hub: $DST_DIGEST"
          [ "$SRC_DIGEST" = "$DST_DIGEST" ]
          echo "PASS: mirror is byte-identical"

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 76,
              body: `:rotating_light: **Manual GHCR -> Docker Hub mirror failed** for tag \`${{ inputs.tag }}\`.\n\nWorkflow run: ${runUrl}\n\n_This is an automated alert. Issue #76 is the permanent CI watch target — do not close it, or these alerts stop working._`
            });

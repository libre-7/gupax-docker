name: Build and Publish (GHCR + Docker Hub)

# One build, pushed to both registries. Previously docker-publish.yml and
# docker-hub-push.yml each ran their own build on separate runners, so the
# "identical image" documented in templates/README.md was never true: apt/Tor
# resolved at different times, digests differed, and a same-day rebuild
# replaced the date tag with different content (#GUP-10).
#
# A single build-push action with tags in both registries pushes the SAME
# manifest/digest to each. The verify step below asserts that.

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/libre-7/gupax-docker
  DOCKERHUB_IMAGE: libre7/gupax-docker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      issues: write  # failure alert comments on the CI watch issue (#76)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build date
        id: date
        run: |
          # BUILD_DATE is the tag component; BUILD_CREATED is the RFC3339
          # timestamp for the OCI label (#GUP-19).
          BUILD_DATE=$(date -u +%Y%m%d)
          BUILD_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"
          echo "BUILD_CREATED=$BUILD_CREATED" >> "$GITHUB_ENV"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "build_created=$BUILD_CREATED" >> "$GITHUB_OUTPUT"
          echo "Build date: $BUILD_DATE ($BUILD_CREATED)"

      - name: Detect Gupax version and pinned hash
        id: version
        env:
          # detect-gupax-version.sh uses GITHUB_TOKEN for Bearer auth to avoid
          # unauthenticated rate limits on GitHub's shared runner IP pool.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/detect-gupax-version.sh
          # detect-gupax-version.sh writes release.env (VERSION + GUPAX_ASSET)
          # shellcheck disable=SC1091
          . ./release.env
          rm -f release.env

          # Trusted digest from the in-repo pin file (#GUP-15). A missing pin
          # is allowed (auto-detected new release) but surfaces as a warning.
          PINNED_SHA=$(awk -v v="$VERSION" -v a="$GUPAX_ASSET" \
            '$1 == v && $2 == a {print $3; exit}' gupax-checksums.txt)
          if [ -z "$PINNED_SHA" ]; then
            echo "::warning title=Unpinned Gupax release::$VERSION ($GUPAX_ASSET) has no entry in gupax-checksums.txt; only the same-origin upstream SHA256SUMS is checked."
          else
            echo "Pinned SHA256 for $VERSION: $PINNED_SHA"
          fi
          echo "GUPAX_SHA256=$PINNED_SHA" >> "$GITHUB_ENV"

          VERSION_STRIPPED="${VERSION#v}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "Detected Gupax version: $VERSION (tag: $VERSION_STRIPPED)"
          # Branch-aware tagging. Slashes -> hyphens (invalid in Docker tags).
          SAFE_REF=$(echo "${{ github.ref_name }}" | tr '/' '-')
          # Tag strategy:
          #   :latest / :2.0.1 / :v2.0.1       — moving, always latest build
          #   :v2.0.1-YYYYMMDD                — date convenience tag; a
          #                                     same-day rebuild replaces it
          #   :v2.0.1-YYYYMMDD-<sha7>         — immutable: build + commit
          #   :<sha>                          — commit-pinned, immutable
          if [ "${{ github.ref_name }}" = "main" ]; then
            TAGS=""
            for REPO in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
              TAGS="${TAGS}${REPO}:latest"$'\n'
              TAGS="${TAGS}${REPO}:${VERSION_STRIPPED}"$'\n'
              TAGS="${TAGS}${REPO}:${VERSION}"$'\n'
              TAGS="${TAGS}${REPO}:${VERSION}-${BUILD_DATE}"$'\n'
              TAGS="${TAGS}${REPO}:${VERSION}-${BUILD_DATE}-${SHORT_SHA}"$'\n'
              TAGS="${TAGS}${REPO}:${{ github.sha }}"$'\n'
            done
          else
            TAGS="${GHCR_IMAGE}:${SAFE_REF}"$'\n'"${GHCR_IMAGE}:${SAFE_REF}-${{ github.sha }}"$'\n'
            TAGS="${TAGS}${DOCKERHUB_IMAGE}:${SAFE_REF}"$'\n'"${DOCKERHUB_IMAGE}:${SAFE_REF}-${{ github.sha }}"$'\n'
          fi
          echo "Tags:"
          echo "$TAGS"
          # Step outputs are the only reliable way to pass these to `with:`;
          # GITHUB_ENV values are not guaranteed to appear in the env context.
          {
            echo "version=$VERSION"
            echo "asset=$GUPAX_ASSET"
            echo "sha256=$PINNED_SHA"
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push once to both registries
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          GUPAX_VERSION: ${{ steps.version.outputs.version }}
          GUPAX_ASSET: ${{ steps.version.outputs.asset }}
          BUILD_DATE: ${{ steps.date.outputs.build_date }}
          BUILD_CREATED: ${{ steps.date.outputs.build_created }}
          GUPAX_REVISION: ${{ github.sha }}
          GUPAX_SHA256: ${{ steps.version.outputs.sha256 }}
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.version.outputs.tags }}
          build-args: |
            GUPAX_VERSION
            GUPAX_ASSET
            BUILD_DATE
            BUILD_CREATED
            GUPAX_REVISION
            GUPAX_SHA256
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify both registries serve the same digest
        # This is what makes "identical image" a checked property instead of a
        # comment. The commit tag is immutable, so comparing it is meaningful.
        run: |
          GHCR_DIGEST=$(docker buildx imagetools inspect \
            "${GHCR_IMAGE}:${{ github.sha }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          HUB_DIGEST=$(docker buildx imagetools inspect \
            "${DOCKERHUB_IMAGE}:${{ github.sha }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "GHCR:       $GHCR_DIGEST"
          echo "Docker Hub: $HUB_DIGEST"
          if [ -z "$GHCR_DIGEST" ] || [ "$GHCR_DIGEST" != "$HUB_DIGEST" ]; then
            echo "FAIL: registry digests differ — the single-build invariant regressed"
            exit 1
          fi
          echo "PASS: both registries serve $GHCR_DIGEST"

      - name: Sync README to Docker Hub description
        # Docker Hub's repository page and the GitHub README are separate
        # artifacts with no automatic propagation. Syncing on every main push
        # makes drift self-healing instead of a perpetual manual chore.
        #
        # `continue-on-error` on purpose: the image is already pushed at this
        # point, and a description-sync failure must not turn a good build red.
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 .github/scripts/sync-docker-hub-description.py

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 76,  # CI watch — keep open, see its body
              body: `:rotating_light: **Registry build failed** — GHCR and Docker Hub are not being updated.\n\nWorkflow run: ${runUrl}\nBranch/commit: \`${context.ref}\` @ \`${context.sha}\`\n\`:latest\` on both registries remains stale until this is fixed.\n\n_This is an automated alert. Issue #76 is the permanent CI watch target — do not close it, or these alerts stop working._`
            });

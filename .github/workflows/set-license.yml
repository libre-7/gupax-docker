name: Set Docker Hub License

on:
  workflow_dispatch:

jobs:
  set-license:
    runs-on: ubuntu-latest
    steps:
      - name: Set license via Docker Hub API (full debug)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, os

          user = os.environ["DOCKER_USERNAME"]
          pwd = os.environ["DOCKER_PASSWORD"]
          repo = "libre7/gupax-docker"
          license_id = "GPL-3.0"

          # Login for JWT
          req = urllib.request.Request(
              "https://hub.docker.com/v2/users/login/",
              data=json.dumps({"username": user, "password": pwd}).encode(),
              headers={"Content-Type": "application/json"}
          )
          token = json.loads(urllib.request.urlopen(req).read())["token"]
          print("Got JWT token")

          # PATCH license
          print("PATCH response...")
          req = urllib.request.Request(
              f"https://hub.docker.com/v2/repositories/{repo}/",
              data=json.dumps({"license": license_id}).encode(),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {token}"
              },
              method="PATCH"
          )
          resp = urllib.request.urlopen(req)
          print(f"PATCH status: {resp.status}")
          patched_data = json.loads(resp.read())
          print(f"PATCH response keys: {list(patched_data.keys())}")
          print(f"license from PATCH response: {patched_data.get('license')}")

          # Verify - dump ALL keys related to licensing
          print("\n--- GET response ---")
          req = urllib.request.Request(
              f"https://hub.docker.com/v2/repositories/{repo}/",
              headers={"Authorization": f"Bearer {token}"}
          )
          data = json.loads(urllib.request.urlopen(req).read())
          license_keys = [k for k in data if 'license' in k.lower()]
          print(f"License-related keys: {license_keys}")
          for k in sorted(data.keys()):
              v = data[k]
              if isinstance(v, str) and len(v) > 80:
                  v = v[:80] + "..."
              print(f"  {k}: {v}")
          PYEOF

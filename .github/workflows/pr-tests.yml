name: PR Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint (Shell + Dockerfile + YAML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ShellCheck (all shell scripts)
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          # scandir '.' already matches every *.sh in the tree, so this covers
          # start.sh, healthcheck.sh and .github/scripts/detect-gupax-version.sh.
          # (The action's `additional_files` is folded into the same `find`, which
          # is why an explicit list here would be a no-op.)
          scandir: '.'
          # Raised from `error` to `style` (the strictest level) — start.sh is
          # now clean at style, so this is enforceable rather than aspirational.
          # The previous `error` gate silently tolerated SC2086/SC2129 for months;
          # a gate that cannot fail on real findings is not a gate. See #73 (L5).
          severity: style

      - name: Hadolint (Dockerfile)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: YAML lint (workflows + compose)
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3
        with:
          file_or_dir: |
            .github/workflows/
            docker-compose.yml

      - name: Validate docker-compose config
        run: docker compose -f docker-compose.yml config --dry-run

  build-and-test:
    name: Build + Runtime Smoke Test (Tor)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          push: false
          tags: gupax-docker:pr-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container with Tor enabled
        run: |
          # The gupax-ci-data volume is REQUIRED, not incidental. Without a
          # volume the data path is missing, start.sh's PUID detection takes
          # its "|| echo 999" branch, and the container runs as miner/999 —
          # which is NOT what a fresh named volume does (that mounts
          # root:root 0755 and yields PUID=0 / gosu 0:0, i.e. the stack
          # running as root). Mounting the volume here is what makes the
          # smoke test cover the path every documented user takes.
          # See #73 (H1).
          docker volume create gupax-ci-data
          docker run -d --name gupax-test \
            -e TOR_ENABLED=true \
            -p 6080:6080 \
            -v gupax-ci-data:/home/miner/.local/share/gupax \
            gupax-docker:pr-test

      - name: Wait for noVNC web interface
        timeout-minutes: 2
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:6080/ > /dev/null 2>&1; then
              echo "noVNC ready after ${i} attempts"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "TIMEOUT: noVNC not responding"
              docker logs gupax-test
              exit 1
            fi
            sleep 4
          done

      - name: Wait for Gupax process
        timeout-minutes: 2
        run: |
          # `pgrep -f gupax` matched ANY process whose command line contains
          # "gupax" — including the runtime-downloaded
          # /home/miner/.local/share/gupax/xmrig/xmrig. If the Gupax GUI died
          # but a downloaded daemon was running, this gate passed. Match the
          # same specific pattern healthcheck.sh:38 uses. See #73 (L1).
          for i in $(seq 1 15); do
            if docker exec gupax-test pgrep -f gupax/gupax 2>/dev/null; then
              echo "Gupax ready after ${i} attempts"
              break
            fi
            if [ $i -eq 15 ]; then
              echo "FAIL: Gupax did not start"
              docker logs gupax-test
              exit 1
            fi
            sleep 2
          done

      - name: Verify Gupax is NOT running as root (H1 regression test)
        # Placed after the Gupax wait above, so the process already exists and
        # this is a single deterministic read rather than another poll loop.
        # The volume mounted in the run step is what makes this meaningful:
        # without it start.sh would take the "|| echo 999" branch and pass
        # regardless. See #73 (H1).
        run: |
          GUPAX_PID=$(docker exec gupax-test pgrep -f gupax/gupax | head -1)
          GUPAX_UID=$(docker exec gupax-test stat -c '%u' "/proc/$GUPAX_PID")
          echo "Gupax PID $GUPAX_PID running as UID $GUPAX_UID"
          if [ "$GUPAX_UID" = "0" ]; then
            echo "FAIL: Gupax is running as root — PUID detection regression (see #73)"
            docker logs gupax-test
            exit 1
          fi
          echo "PASS: Gupax is non-root (UID $GUPAX_UID)"

      - name: Verify Tor SOCKS proxy (9050)
        timeout-minutes: 2
        run: |
          # Fatal, not a warning. Tor is the most complex code path in this
          # project and a regression here previously passed CI green. 20
          # attempts x 3s = 60s of budget, which the live run cleared on
          # attempt 1. See #73 (M3).
          for i in $(seq 1 20); do
            if docker exec gupax-test bash -c 'echo > /dev/tcp/127.0.0.1/9050' 2>/dev/null; then
              echo "Tor SOCKS proxy ready (attempt ${i})"
              break
            fi
            if [ $i -eq 20 ]; then
              echo "FAIL: Tor SOCKS proxy never came up on 127.0.0.1:9050"
              docker logs gupax-test
              exit 1
            fi
            sleep 3
          done

      - name: Verify Tor version is not the stale distro build
        run: |
          # This image adds the Tor Project apt repo for exactly one reason:
          # the distro's own Tor is too old to be accepted by the network
          # (missing FlowCtrl=2 / Relay=4). The SOCKS + onion assertions
          # above still pass on a stale Tor — they prove it runs, not that
          # it is new enough. That gap let a base-image bump silently
          # downgrade Tor; assert the version explicitly.
          #
          # 0.4.6.10 is the 22.04 archive build this repo works around.
          # Require >= 0.4.7 and fail loudly with the actual version.
          #
          # Accept 2-4 components, not exactly 4: Tor ships 0.4.6.10 but a
          # future 1.0.0 must not be unparseable (that would reject a newer,
          # perfectly good Tor). Padded to 4 components for a tidy,
          # predictable log line — note this is cosmetic, NOT a correctness
          # fix: `sort -V` already orders ragged versions correctly, which
          # the mutation test in the PR description verifies.
          TOR_VER="$(docker exec gupax-test tor --version 2>/dev/null | head -1 \
            | grep -oE '[0-9]+(\.[0-9]+){1,3}' | head -1 || true)"
          if [ -z "$TOR_VER" ]; then
            echo "FAIL: could not determine the Tor version inside the container"
            docker exec gupax-test tor --version 2>&1 || true
            exit 1
          fi
          # Normalise to 4 components for a correct dotted comparison.
          while [ "$(echo "$TOR_VER" | tr -cd '.' | wc -c)" -lt 3 ]; do
            TOR_VER="${TOR_VER}.0"
          done
          echo "Tor version in container: $TOR_VER"
          LOWEST_OK="0.4.7.0"
          if [ "$(printf '%s\n%s\n' "$LOWEST_OK" "$TOR_VER" | sort -V | head -1)" != "$LOWEST_OK" ]; then
            echo "FAIL: Tor $TOR_VER is older than the required floor $LOWEST_OK"
            echo "      The Tor Project apt repo is not being applied — check the"
            echo "      suite in the Dockerfile's tor.list line matches the base image."
            exit 1
          fi
          echo "PASS: Tor $TOR_VER is at or above the $LOWEST_OK floor"

      - name: Verify hidden service hostname
        run: |
          for i in $(seq 1 15); do
            HS=$(docker exec gupax-test cat /home/miner/.tor/hs_monerod/hostname 2>/dev/null | tr -d '[:space:]' || echo "")
            if [ -n "$HS" ] && [ ${#HS} -gt 40 ]; then
              echo "Hidden service onion: $HS"
              break
            fi
            if [ $i -eq 15 ]; then
              echo "FAIL: hidden service .onion hostname never generated"
              docker logs gupax-test
              exit 1
            fi
            sleep 2
          done

      - name: Container health check
        timeout-minutes: 3
        run: |
          # Poll instead of a single read. HEALTHCHECK runs on interval=30s
          # with start-period=60s, so a fixed `sleep 5` is a race: the
          # previous gate read `healthy` at T+15.5s on a fast runner but
          # would see `starting` on a slow one and fail a working build.
          # #72 correctly tightened the accepted value from
          # `healthy|starting|no-healthcheck` to `healthy` only; this adds the
          # bounded wait that makes that strictness safe. See #73 (L2).
          for i in $(seq 1 24); do
            HEALTH=$(docker inspect gupax-test --format='{{.State.Health.Status}}' 2>/dev/null || echo "no-healthcheck")
            echo "Container health: $HEALTH (attempt ${i})"
            case "$HEALTH" in
              healthy)
                echo "PASS: container reached healthy"
                exit 0
                ;;
              unhealthy)
                echo "FAIL: container reported unhealthy"
                docker logs gupax-test
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "FAIL: container still '$HEALTH' after 120s (expected healthy)"
          docker logs gupax-test
          exit 1

      - name: Health check detects dead VNC stack (M1 regression test)
        # Final test — the container is sacrificed by design.
        # M1: healthcheck.sh previously probed only websockify's static file
        # server, which keeps serving index.html even after x11vnc dies.
        # It now probes the VNC port (5900) and the x11vnc/Gupax processes.
        # Kill x11vnc and confirm the container transitions to unhealthy.
        run: |
          docker exec gupax-test pkill -x x11vnc
          # HEALTHCHECK: interval 30s, retries 3 → worst case ~90s to flip
          # to unhealthy. Poll for up to 120s.
          for i in $(seq 1 24); do
            HEALTH=$(docker inspect gupax-test --format='{{.State.Health.Status}}')
            if [ "$HEALTH" = "unhealthy" ]; then
              echo "PASS: dead VNC detected after ${i} probes (M1 fix works)"
              exit 0
            fi
            sleep 5
          done
          echo "FAIL: dead VNC NOT detected within 120s — healthcheck regression"
          docker exec gupax-test /usr/local/bin/healthcheck.sh || true
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker logs gupax-test

      - name: Cleanup
        if: always()
        run: |
          docker rm -f gupax-test 2>/dev/null || true
          docker volume rm gupax-ci-data 2>/dev/null || true

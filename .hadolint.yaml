ignored:
  # apt packages are deliberately not version-pinned (except tor, which is).
  # Reproducibility comes from the digest-pinned base image plus the explicit
  # tor/keyring pins; pinning every transitive apt package would break builds
  # on every Ubuntu security update.
  - DL3008
  - DL3059   # Multiple consecutive RUN instructions (keeps layers cacheable)
  # SC2046 is deliberately NOT ignored: it only fires on an *unquoted* command
  # substitution, and the Dockerfile's two (`[arch=$(dpkg ...)]` inside quotes,
  # `PINNED=$(awk ...)` as an assignment) are both fine. Suppressing it would
  # hide the first genuinely unquoted one (#review L15).
